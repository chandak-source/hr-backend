# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. `sync: false` values are filled in the
# Render dashboard; MONGODB_URI comes from MongoDB Atlas.
services:
  - type: web
    name: hr-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # Liveness, not readiness — /health returns 503 when MongoDB is down, which
    # would make Render restart the service in a loop.
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      # Render injects PORT itself — don't set it here.
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_TOKEN_EXPIRES_IN_DAYS
        value: "30"
      # The only domain an account may be created under.
      - key: ALLOWED_EMAIL_DOMAIN
        value: "@superaip.com"
      - key: AUTH_RATE_LIMIT
        value: "50"
      # Default password for accounts created through the app's Create User
      # form. The new user should change it on first sign-in.
      - key: SEED_PASSWORD
        sync: false
      # Atlas SRV resolves normally on Render; the local DNS workaround is
      # deliberately left unset here.
      - key: DNS_SERVERS
        value: ""
      # Atlas connection string, including the database name in the path.
      - key: MONGODB_URI
        sync: false
      # Only needed if the database should differ from the URI path.
      - key: MONGODB_DB
        sync: false
